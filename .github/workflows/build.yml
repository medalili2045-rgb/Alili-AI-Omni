name: Build Alili Omni
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Setup Android & Permissions
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name alili_omni --org com.alili --template=app
          
          # 1. تطبيق الصلاحيات وتغيير الاسم
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="alili_omni"/android:label="Alili Omni"/' android/app/src/main/AndroidManifest.xml
          
          # 2. فرض إصدارات Gradle و AGP المتوافقة مع Flutter 3.24.0
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.10"/' android/build.gradle
          sed -i 's/classpath .*com.android.tools.build:gradle.*/classpath "com.android.tools.build:gradle:8.5.0"/' android/build.gradle
          
          # 3. ترقية Gradle Wrapper إلى 8.7 (المطلوب لـ AGP 8.5.0)
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          
          # 4. تثبيت الحزم وبناء الأيقونات
          flutter pub get
          flutter clean
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          
      - name: Build APK
        run: flutter build apk --release --stacktrace
        
      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v13.0.${{ github.run_number }}
          name: Alili Omni v13.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
