name: Build Alili Omni
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Print Debug Info
        run: |
          echo "Java Version:"
          java -version
          echo "Flutter Version:"
          flutter --version

      - name: Recreate Android (if missing) & Apply Permissions
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name alili_omni --org com.alili --template=app
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest /a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>' "$MANIFEST" || true
          sed -i 's/android:label="alili_omni"/android:label="Alili Omni"/' "$MANIFEST" || true

          if [ -f "android/build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.10"/' android/build.gradle || true
            sed -i 's/classpath .*com.android.tools.build:gradle.*/classpath "com.android.tools.build:gradle:8.5.0"/' android/build.gradle || true
          fi
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties || true
          fi

      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          flutter clean

      - name: Get Dependencies
        run: |
          flutter pub get
          flutter pub get # إعادة الجلب بعد clean

      - name: Build APK
        run: flutter build apk --release

      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v13.0.${{ github.run_number }}
          name: Alili Omni v13.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
