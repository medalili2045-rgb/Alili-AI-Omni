name: Build Alili Omni
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Android
        run: |
          flutter create . --platforms=android --project-name alili_omni --org com.alili
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest /a \    <uses-permission android:name="android.permission.INTERNET"\/>' "$MANIFEST" || true
          sed -i 's/android:label="alili_omni"/android:label="Alili Omni"/' "$MANIFEST" || true
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v13.0.${{ github.run_number }}
          name: Alili Omni v13.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
